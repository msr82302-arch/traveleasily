.hero em{color:var(--wine);font-style:normal}.hero p{opacity:.85;max-width:520px;margin:0 0 20px}
.eb{display:inline-block;border:1px solid #A9C2E0;background:#A9C2E0;border-radius:30px;padding:3px 14px;font-size:13px;color:#000}
.bt{display:flex;gap:10px;flex-wrap:wrap}
.fl{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.fl span{background:var(--pr2);border:1px solid var(--bd);border-radius:16px;aspect-ratio:1;display:grid;place-items:center;font-size:clamp(28px,5vw,40px);animation:bob 4s ease-in-out infinite}
.pghead{background:#fff;color:var(--tx);border-bottom:1px solid var(--bd);padding:30px 0}.pghead h1{font-size:clamp(26px,5vw,38px);margin:0 0 4px}.pghead p{margin:0;opacity:.8}.pg-blue p{display:inline-block;background:#A9C2E0;color:#000;opacity:1;border-radius:30px;padding:4px 16px;margin-top:8px}
.strip{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sf);border:1px solid var(--bd);border-radius:16px;margin-top:-34px;position:relative;box-shadow:0 12px 30px rgba(207,49,38,.12)}
.strip div{padding:16px;text-align:center;border-right:1px solid var(--bd)}.strip div:last-child{border:0}.strip b{display:block;font-size:22px;color:var(--pr)}.strip small{color:var(--mu)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:18px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin:14px 0}.grid .card{margin:0}
.ic{width:44px;height:44px;border-radius:12px;background:var(--pr2);display:grid;place-items:center;font-size:22px;margin-bottom:10px}
.num{width:34px;height:34px;border-radius:50%;background:var(--wine);color:#fff;display:grid;place-items:center;font-weight:800;margin-bottom:8px}
.c{background:var(--sf);border:2px solid var(--bd);border-radius:16px;padding:16px;cursor:pointer;text-align:left;color:var(--tx);font:inherit;transition:transform .2s,box-shadow .2s,border-color .2s}
.c:hover{transform:translateY(-4px);box-shadow:0 14px 26px rgba(207,49,38,.12);border-color:var(--pr)}.c.on{border-color:var(--pr);background:var(--pr2)}.c .f{font-size:34px;display:block;margin-bottom:4px}.c small{color:var(--mu)}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);color:var(--tx);font:inherit;user-select:text}
input:focus,select:focus{outline:2px solid var(--pr);outline-offset:1px}input.bad,select.bad{border-color:var(--er)}.err{color:var(--er);font-size:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}@media(max-width:600px){.row{grid-template-columns:1fr}.strip{grid-template-columns:1fr}.strip div{border:0;border-bottom:1px solid var(--bd)}}
button,.btn{border:0;border-radius:10px;padding:12px 22px;font:600 15px system-ui,sans-serif;cursor:pointer;text-decoration:none;display:inline-block;transition:transform .15s,filter .15s,box-shadow .15s}
.p{background:var(--pr);color:var(--on);box-shadow:0 6px 16px rgba(207,49,38,.28)}.p:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.1)}
.s{background:var(--pr2);color:var(--pr)}.g{background:transparent;color:var(--wine);border:1px solid var(--wine)}.g:hover{background:var(--pr2)}
button:disabled{opacity:.5;cursor:not-allowed}
.acts{display:flex;justify-content:space-between;gap:8px;margin:22px 0;flex-wrap:wrap}
.steps{display:flex;gap:6px;margin:22px 0 8px}.steps div{flex:1;text-align:center;font-size:11px;color:var(--mu);border-top:4px solid var(--bd);padding-top:5px;transition:.4s}.steps .d{border-color:var(--pr);color:var(--pr);font-weight:700}
@media(max-width:600px){.steps div{font-size:0}.steps .cu{font-size:12px;flex:3}}
.note{background:var(--pr2);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--mu)}
.up{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.th{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--pr2);display:grid;place-items:center}
.bar{height:6px;background:var(--bd);border-radius:4px;overflow:hidden;width:140px}.bar i{display:block;height:100%;background:var(--pr);transition:width .2s}
.tag{display:inline-block;background:var(--pr2);color:var(--pr);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700}
.sum td{padding:4px 10px 4px 0;font-size:14px;vertical-align:top}.sum td:first-child{color:var(--mu)}
.ban{background:var(--wine);color:var(--sand);border-radius:18px;padding:26px;margin:28px 0;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;position:relative;overflow:hidden}
.ban:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:26px solid rgba(241,234,226,.2)}
.ban h2{margin:0 0 4px}.ban p{margin:0;opacity:.9}.ban .btn{background:#fff;color:var(--wine);position:relative;z-index:1}
details{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin:10px 0;transition:box-shadow .2s}details[open]{box-shadow:0 8px 18px rgba(207,49,38,.08)}summary{cursor:pointer;font-weight:600}
footer{background:#CF3126;color:#fff;margin-top:50px;padding:34px 0 20px;font-size:14px}footer h3{color:#fff}footer a{color:#fff;text-decoration:underline;cursor:pointer;text-decoration:none}
.fg{display:grid;grid-template-columns:2fr 1fr;gap:24px}@media(max-width:700px){.fg{grid-template-columns:1fr}}
.ok{color:var(--ok)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes pg{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
#app{animation:pg .4s both}.hero h1{animation:up .7s both}.hero p{animation:up .7s .12s both}.hero .bt{animation:up .7s .24s both}
.rv{opacity:0;transform:translateY(20px);transition:opacity .6s,transform .6s}.rv.in{opacity:1;transform:none}
.fl span:nth-child(odd){animation-duration:3.4s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
@font-face{font-family:"Twemoji Country Flags";unicode-range:U+1F1E6-1F1FF,U+1F3F4,U+E0062-E007F;src:url("https://cdn.jsdelivr.net/npm/country-flag-emoji-polyfill@0.1.8/dist/TwemojiCountryFlags.woff2") format("woff2");font-display:swap}
.hero .p{background:var(--wine);color:#fff;box-shadow:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button:focus-visible,a:focus-visible,label.btn:focus-within{outline:3px solid var(--pr);outline-offset:2px}.ban a:focus-visible{outline-color:#fff}.ban-white{background:#fff;color:#202020;border:2px solid #CF3126}.ban-white:after{border-color:rgba(207,49,38,.12)}.ban-white .btn{background:#CF3126;color:#fff}.ban-white a:focus-visible{outline-color:#CF3126}.ban-blue{background:#A9C2E0;color:#202020}.ban-blue:after{border-color:rgba(255,255,255,.35)}.ban-blue .btn{background:#fff;color:#202020}.ban-blue a:focus-visible{outline-color:#202020}
#app:focus{outline:none}textarea{min-height:90px;resize:vertical;-webkit-user-select:text;user-select:text}input,select{-webkit-user-select:text}.row .full{grid-column:1/-1}
input.auto,select.auto{background:var(--pr2)}img{-webkit-touch-callout:none}
.skip{position:absolute;left:-999px;top:0;background:var(--wine);color:var(--sand);padding:10px 14px;z-index:20}.skip:focus{left:8px;top:8px}
nav{scrollbar-width:none}nav::-webkit-scrollbar{display:none}

function validate(){const f=S.f,E={},td=new Date().toISOString().slice(0,10);FIELDS.forEach(([k,,,o])=>{if(!o&&!String(f[k]||"").trim())E[k]="Required"});if(f.email&&!/^\S+@\S+\.\S+$/.test(f.email))E.email="Enter a valid email";if(f.wa&&!/^\+?[\d\s-]{7,16}$/.test(f.wa))E.wa="Enter a valid number";if(f.dob&&f.dob>=td)E.dob="Must be in the past";if(f.pexp&&f.pexp<=td)E.pexp="Passport has expired";if(f.pexp&&f.travel&&f.pexp<f.travel)E.pexp="Expires before travel date";if(f.travel&&f.travel<td)E.travel="Must not be in the past";if(f.pissue&&f.pexp&&f.pissue>=f.pexp)E.pissue="Must be before expiry";if(f.napp&&!(Number.isInteger(+f.napp)&&+f.napp>=1&&+f.napp<=20))E.napp="Enter 1 to 20";S.errs=E;if(Object.keys(E).length){draw();setTimeout(()=>{const b=document.querySelector(".bad");b&&b.focus()},0);return false}return true}
function s3(){const c=C[S.dest],f=S.f,sec=(t,pg,rows)=>`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3>${t}</h3><button class="s" onclick="go('${pg}')">Edit</button></div><table class="sum">${rows}</table></div>`;return`<h2 style="margin-top:8px">Review your application</h2>${sec("Trip","countries",`<tr><td>Destination</td><td>${c[1]} ${c[0]}</td></tr><tr><td>Visa</td><td>${esc(S.visa)}</td></tr><tr><td>Nationality</td><td>${esc(S.nat)}</td></tr><tr><td>Processing option</td><td>Not selected (to be confirmed)</td></tr>`)}${sec("Applicant &amp; passport","details",FIELDS.map(([k,l])=>`<tr><td>${l}</td><td>${esc(f[k])||"–"}</td></tr>`).join(""))}${sec("Documents","documents",`<tr><td colspan=2><div class="up">${SLOTS.filter(s=>S.files[s[0]]).map(s=>{const x=S.files[s[0]];return`<div>${x.img?`<img class="th" src="${x.url}" alt="${s[1]}">`:`<div class="th">PDF</div>`}<br><small>${s[1]}</small></div>`}).join("")||"No documents uploaded"}</div></td></tr>`)}${nav(false,"Proceed to checkout")}`}
function s4(){const b=S.bill,c=C[S.dest];return`<h2 style="margin-top:8px">Checkout 🔒</h2><div class="note">Demo only: no payment is processed. Do <b>not</b> enter real card details.</div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div><div class="card"><h3>Billing information</h3><label>Name</label><input id="bn" value="${esc(b.n??S.f.name)}"><label>Email</label><input id="be" type="email" value="${esc(b.e??S.f.email)}"><div class="err" id="ce"></div></div><div class="card"><h3>Payment method</h3><label>Card number (demo)</label><input disabled placeholder="•••• •••• •••• ••••"><div class="row"><div><label>Expiry</label><input disabled placeholder="MM/YY"></div><div><label>CVC</label><input disabled placeholder="•••"></div></div><small>Payment fields are disabled in this demo.</small></div></div><div class="card"><h3>Order summary</h3><table class="sum" style="width:100%"><tr><td>${c[1]} ${c[0]} – ${esc(S.visa)}</td><td>[fee TBC]</td></tr><tr><td>Applicant</td><td>${esc(S.f.name)}</td></tr><tr><td>Number of applicants</td><td>${esc(S.f.napp||"1")}</td></tr><tr><td>Service fee</td><td>[placeholder]</td></tr><tr><td><b>Total</b></td><td><b>[placeholder]</b></td></tr></table></div></div><div class="acts"><button class="s" onclick="back()">Back</button><button class="p" id="pay" onclick="pay()">Submit demo order</button></div>`}
function pay(){const e=$("#be").value;if(!$("#bn").value.trim()||!/^\S+@\S+\.\S+$/.test(e)){$("#ce").textContent="Enter billing name and a valid email.";return}S.bill={n:$("#bn").value,e};S.ref="DEMO-"+Math.random().toString(36).slice(2,8).toUpperCase();const p=$("#pay");p.disabled=true;p.textContent="Processing demo…";setTimeout(()=>{Object.values(S.files).forEach(x=>URL.revokeObjectURL(x.url));S.files={};S.ocr="";go("confirmation")},1600)}
function s5(){const c=C[S.dest],f=S.f,pn=f.pno?f.pno.slice(0,2)+"•".repeat(Math.max(0,f.pno.length-4))+f.pno.slice(-2):"–";return`<div class="w"><div class="card" style="text-align:center;margin-top:30px"><div style="font-size:48px" aria-hidden="true">✅</div><h2 style="margin:0">Demo submission complete</h2><p>Thank you, <b>${esc(f.name)}</b>. Your demo application reached the end of the flow.</p><p class="note"><b>This is a frontend demonstration.</b> No application was submitted, nothing was stored or sent to Easy Travels, no payment was taken and there is no government approval. Uploaded documents have been cleared from this page.</p></div><div class="card"><h3>Application summary</h3><table class="sum"><tr><td>Demo reference</td><td>${esc(S.ref||"DEMO")}</td></tr><tr><td>Destination</td><td>${c[1]} ${c[0]}</td></tr><tr><td>Visa</td><td>${esc(S.visa)}</td></tr><tr><td>Nationality</td><td>${esc(S.nat)}</td></tr><tr><td>Applicant</td><td>${esc(f.name)}</td></tr><tr><td>Passport number</td><td>${esc(pn)}</td></tr><tr><td>Travel date</td><td>${esc(f.travel)||"–"}</td></tr><tr><td>Number of applicants</td><td>${esc(f.napp||"1")}</td></tr><tr><td>Total</td><td>[placeholder]</td></tr></table><p>For real enquiries, call Easy Travels on ${PH}.</p><button class="p" onclick="fresh();go('home')">Clear data &amp; return home</button></div></div>`}
addEventListener("contextmenu",e=>{if(!/INPUT|TEXTAREA/.test(e.target.tagName||""))e.preventDefault()});
["copy","cut","dragstart"].forEach(t=>addEventListener(t,e=>{if(!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName||document.activeElement.tagName))e.preventDefault()}));
addEventListener("beforeunload",()=>{if(S.files)Object.values(S.files).forEach(x=>URL.revokeObjectURL(x.url))});
draw();
</script>

</body></html>
